# Gateway topology: receives OTLP from the two agents, OpAMP-managed like
# them.
extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  opamp:
    server:
      ws:
        endpoint: wss://opamp-gateway:4320/v1/opamp
        tls:
          ca_file: /certs/ca.pem
          cert_file: /certs/gateway.pem
          key_file: /certs/gateway-key.pem
    agent_description:
      non_identifying_attributes:
        deployment.environment: dev
        service.namespace: grex-dev

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

exporters:
  debug:

service:
  extensions: [health_check, opamp]
  pipelines:
    metrics:
      receivers: [otlp]
      exporters: [debug]
