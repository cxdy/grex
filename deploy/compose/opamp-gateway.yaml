# OpAMP gateway: accepts agent OpAMP connections and multiplexes them over a
# few upstream connections to grex, via Envoy (deploy/compose/envoy.yaml),
# which least-connections balances those upstream connections across the
# grex/grex-2 replicas. The nop pipeline exists only because the collector
# requires at least one pipeline.
extensions:
  opampgateway:
    server:
      endpoint: wss://envoy:4320/v1/opamp
      # 2, one per grex replica, deliberately not bumped higher: both
      # connects fire microseconds apart at startup (confirmed via this
      # extension's own logs), tighter than a TCP handshake, so they
      # sometimes both land on the same grex replica through Envoy's
      # LEAST_REQUEST tie-break — see deploy/compose/smoke.sh's note on
      # this. Left as-is rather than raising this to mask the race behind
      # more trials.
      connections: 2
      tls:
        ca_file: /certs/ca.pem
        cert_file: /certs/opamp-gateway-client.pem
        key_file: /certs/opamp-gateway-client-key.pem
    listener:
      endpoint: 0.0.0.0:4320
      tls:
        cert_file: /certs/opamp-gateway.pem
        key_file: /certs/opamp-gateway-key.pem
        client_ca_file: /certs/ca.pem

receivers:
  nop:

exporters:
  nop:

service:
  extensions: [opampgateway]
  pipelines:
    metrics:
      receivers: [nop]
      exporters: [nop]
