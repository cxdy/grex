# grex configuration for the compose dev stack.
listeners:
  opamp: ":4320"
  ui: ":8080"
  telemetry: ":9090"

opamp_tls:
  cert_file: /certs/server.pem
  key_file: /certs/server-key.pem
  client_ca_file: /certs/ca.pem

ui_tls:
  cert_file: /certs/server.pem
  key_file: /certs/server-key.pem
  client_ca_file: /certs/ca.pem

telemetry_tls:
  cert_file: /certs/server.pem
  key_file: /certs/server-key.pem
  client_ca_file: /certs/ca.pem

# /healthz and /readyz stay open with no client cert; every other route on
# the UI and telemetry listeners requires one mapped to a role below.
auth:
  default_role: none
  role_mapping:
    - match: exact
      spiffe_id: spiffe://grex-api.internal/user/alice
      role: viewer
    - match: exact
      spiffe_id: spiffe://grex-api.internal/user/admin
      role: admin
    - match: exact
      spiffe_id: spiffe://grex-api.internal/service/prometheus
      role: viewer

fleet:
  required_attributes:
    - deployment.environment
    - service.namespace

# Opt-in: persistence, the read API's cross-replica DB fallback, and the
# soft-delete purge job all activate on database.host being set (see
# cmd/grex/main.go). Same block on both grex and grex-2 — one shared
# Postgres, matching compose.yaml's postgres service.
database:
  host: postgres
  port: 5432
  user: grex
  password: grex-dev-password
  dbname: grex
  sslmode: disable

log:
  # debug in dev so per-agent lifecycle lines are visible to smoke.sh;
  # production default is info, which keeps per-connection logging quiet.
  level: debug
  format: json
