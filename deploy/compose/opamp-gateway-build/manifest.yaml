dist:
  name: opamp-gateway
  description: Minimal collector shipping the patched opampgateway extension
  version: 1.10.0-grex.1
  output_path: /build/out

extensions:
  - gomod: github.com/observiq/bindplane-otel-contrib/extension/opampgateway v1.10.0

receivers:
  - gomod: go.opentelemetry.io/collector/receiver/nopreceiver v0.156.0

exporters:
  - gomod: go.opentelemetry.io/collector/exporter/nopexporter v0.156.0

replaces:
  - github.com/observiq/bindplane-otel-contrib/extension/opampgateway => /build/opampgateway
