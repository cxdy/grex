# Prometheus for the compose dev stack. Two jobs, one per grex metrics
# endpoint, mirroring the intended production layout: server health scraped
# fast, fleet series scraped at heartbeat granularity with its own
# sample_limit so a fleet cardinality blowout cannot drop server health
# samples. Each job scrapes both grex replicas as separate targets — same
# shape as production, replicas told apart by Prometheus's own `instance`
# label, no grex-side change needed (see docs/spec/design.md's Load
# balancing section).
global:
  scrape_interval: 15s

# grex's telemetry listener terminates TLS and requires a client certificate
# mapped to a role (deploy/compose/grex.yaml auth.role_mapping); Prometheus
# authenticates as spiffe://grex-api.internal/service/prometheus.
scrape_configs:
  - job_name: grex-server
    scheme: https
    metrics_path: /metrics
    tls_config:
      ca_file: /certs/ca.pem
      cert_file: /certs/service-prometheus.pem
      key_file: /certs/service-prometheus-key.pem
    static_configs:
      - targets: ["grex:9090", "grex-2:9090"]

  - job_name: grex-fleet
    scheme: https
    metrics_path: /metrics/fleet
    scrape_interval: 30s
    sample_limit: 5000
    tls_config:
      ca_file: /certs/ca.pem
      cert_file: /certs/service-prometheus.pem
      key_file: /certs/service-prometheus-key.pem
    static_configs:
      - targets: ["grex:9090", "grex-2:9090"]

  - job_name: otelcol
    static_configs:
      - targets:
          - "otelcol-agent-1:8888"
          - "otelcol-agent-2:8888"
          - "otelcol-gateway:8888"

  # Envoy's own per-upstream connection-count stats, to compare directly
  # against grex_agents_connected per replica.
  - job_name: envoy
    metrics_path: /stats/prometheus
    static_configs:
      - targets: ["envoy:9901"]

  - job_name: grex-postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # Placeholder: River's job/queue tables and metrics don't exist yet (no
  # migrations, no schema — see internal/persistence and design.md's "Jobs:
  # schema and execution"). This job is declared now against a port nothing
  # serves yet, so a future goal adding River's schema and metrics only needs
  # to point this target at the real thing, not add a new job. Expect this
  # target to show as down in Prometheus until then.
  - job_name: grex-river
    static_configs:
      - targets: ["postgres-exporter:9188"]
