apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "grex.fullname" . }}-test-connection"
  labels:
    {{- include "grex.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox:1.36
      command: ['wget']
      args:
        - -qO-
        - 'http://{{ include "grex.fullname" . }}:{{ .Values.service.ports.telemetry.port }}/healthz'
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        runAsNonRoot: true
        runAsUser: 65534
        readOnlyRootFilesystem: true
  restartPolicy: Never
