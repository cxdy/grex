{{define "head"}}
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{if .Title}}{{.Title}} · {{end}}grex</title>
<link rel="icon" href="/static/favicon.png" type="image/png">
<script>
  // Prevent flash: apply stored/system theme before paint.
  (function () {
    try {
      var t = localStorage.getItem("grex-theme");
      if (t !== "light" && t !== "dark") {
        t = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      }
      document.documentElement.setAttribute("data-theme", t);
    } catch (e) {
      document.documentElement.setAttribute("data-theme", "dark");
    }
  })();
</script>
<link rel="stylesheet" href="/static/app.css">
<script src="/static/htmx.min.js" defer></script>
<script src="/static/matcher.js" defer></script>
<script src="/static/theme.js" defer></script>
<script src="/static/yaml-highlight.js" defer></script>
{{end}}

{{define "header"}}
<header class="app-header">
  <a class="brand" href="/">
    <img src="/static/logo-mark.png" srcset="/static/logo-mark.png 1x, /static/logo-mark@2x.png 2x" width="32" height="32" alt="">
    grex
  </a>
  <nav class="nav" aria-label="Primary">
    <a href="/" {{if eq .Nav "fleet"}}aria-current="page"{{end}}>Fleet</a>
    <a href="/status" {{if eq .Nav "status"}}aria-current="page"{{end}}>Status</a>
  </nav>
  <div class="header-meta">
    <span class="live-dot" title="Auto-refresh every {{.PollInterval}}">Live</span>
    <span class="htmx-indicator">Updating…</span>
    <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Toggle color theme" title="Toggle theme">
      <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
      </svg>
      <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M21 14.5A8.5 8.5 0 0 1 9.5 3 7 7 0 1 0 21 14.5z"/>
      </svg>
    </button>
  </div>
</header>
{{end}}
