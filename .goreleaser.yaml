# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: grex

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: grex
    main: ./cmd/grex
    binary: grex
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/dennisme/grex/internal/buildinfo.Version={{ .Version }}
      - -X github.com/dennisme/grex/internal/buildinfo.Commit={{ .ShortCommit }}
      - -X github.com/dennisme/grex/internal/buildinfo.Date={{ .CommitDate }}

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

# Release notes via GitHub's generate-notes API (merged PRs with full PR URLs).
# Required for real PR links: this repo merges with "Create a merge commit", so
# subjects are plain "feat: …" without "(#N)". Commit-log backends cannot
# invent PR associations; github-native can.
#
# Groups / format / filters are not applied with github-native. Optional
# categories via labels: .github/release.yml
changelog:
  use: github-native

release:
  name_template: "v{{ .Version }}"
  # Packaged by the goreleaser workflow (outside dist/ so --clean is safe).
  extra_files:
    - glob: ./.chart-release/*.tgz
  # Appended after the generated changelog on the GitHub Release.
  footer: |
    ---

    **Full Changelog**: https://github.com/dennisme/grex/compare/{{ .PreviousTag }}...{{ .Tag }}

    **Docker:** `ghcr.io/dennisme/grex:{{ .Version }}` (also `{{ .Tag }}`)

    **Helm (Pages chart repo):**
    ```
    helm repo add grex https://dennisme.github.io/grex/charts/
    helm repo update
    helm upgrade --install grex grex/grex --version {{ .Version }} -n grex --create-namespace
    ```

    **Helm (OCI):**
    ```
    helm upgrade --install grex oci://ghcr.io/dennisme/charts/grex --version {{ .Version }} -n grex --create-namespace
    ```

    **Docs:** https://dennisme.github.io/grex/

# Multi-arch image (buildx). Dockerfile copies the pre-built binary; it does not
# recompile Go. Keep Dockerfile (repo root) for local/source builds.
# Tag both "{{ .Version }}" (no v) and "{{ .Tag }}" (with v): the Helm chart
# defaults image.tag to Chart.AppVersion, which is SemVer without a "v" prefix.
dockers_v2:
  - images:
      - ghcr.io/dennisme/grex
    tags:
      - "{{ .Tag }}"
      - "{{ .Version }}"
      - "v{{ .Major }}"
      - "v{{ .Major }}.{{ .Minor }}"
      - "{{ .Major }}.{{ .Minor }}"
      - latest
    dockerfile: Dockerfile.goreleaser
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      "org.opencontainers.image.title": "{{ .ProjectName }}"
      "org.opencontainers.image.description": "OpAMP control plane for OpenTelemetry Collector fleets"
      "org.opencontainers.image.url": "https://dennisme.github.io/grex/"
      "org.opencontainers.image.source": "https://github.com/dennisme/grex"
      "org.opencontainers.image.licenses": "Apache-2.0"
      "org.opencontainers.image.created": "{{ .Date }}"
      "org.opencontainers.image.revision": "{{ .FullCommit }}"
      "org.opencontainers.image.version": "{{ .Version }}"
