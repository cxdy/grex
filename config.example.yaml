# grex configuration. Every field shown with its default.
# Each field can be overridden with a GREX_* environment variable,
# e.g. GREX_LISTENERS_OPAMP, GREX_LOG_LEVEL.

listeners:
  # OpAMP endpoint for collector agents and gateways.
  opamp: ":4320"
  # Web UI and read API.
  ui: ":8080"
  # Health probes and Prometheus /metrics.
  telemetry: ":9090"

tls:
  # cert_file and key_file enable TLS on the OpAMP listener.
  cert_file: ""
  key_file: ""
  # client_ca_file additionally requires and verifies client
  # certificates (mTLS). Requires cert_file and key_file.
  client_ca_file: ""

metrics:
  # Per-agent metric series (grex_agent_health,
  # grex_agent_last_seen_timestamp_seconds) are omitted entirely when the
  # fleet exceeds this limit; aggregate series always remain.
  per_agent_series_limit: 1000

fleet:
  # How often each agent is expected to check in.
  heartbeat_interval: 30s
  # How many consecutive check-ins an agent may miss before it is
  # evicted from fleet state and the UI.
  stale_missed_heartbeats: 3
  # AgentDescription attribute keys every agent must report. Missing keys
  # are logged and counted in metrics; empty disables enforcement.
  required_attributes: []

log:
  # debug, info, warn, error
  level: info
  # text, json
  format: text
