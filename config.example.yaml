# grex configuration. Every field shown with its default.
# Each field can be overridden with a GREX_* environment variable,
# e.g. GREX_LISTENERS_OPAMP, GREX_LOG_LEVEL.

listeners:
  # OpAMP endpoint for collector agents and gateways.
  opamp: ":4320"
  # Web UI and read API.
  ui: ":8080"
  # Health probes and Prometheus /metrics.
  telemetry: ":9090"

opamp_tls:
  # cert_file and key_file enable TLS on the OpAMP listener.
  cert_file: ""
  key_file: ""
  # client_ca_file additionally requires and verifies client
  # certificates (mTLS). Requires cert_file and key_file. Collectors and
  # OpAMP gateways are the peers.
  client_ca_file: ""

ui_tls:
  # Same shape as opamp_tls, for the UI/API listener. Human and
  # script/automation callers are the peers. A client cert is optional
  # at the TLS handshake (so a caller with no cert still connects); the
  # request is then rejected with 403 unless auth resolves a role for it.
  cert_file: ""
  key_file: ""
  client_ca_file: ""

telemetry_tls:
  # Same shape, for the telemetry listener. Prometheus is the peer.
  # /healthz and /readyz are exempt from the role check even when
  # client_ca_file is set, since orchestrator health probes present no
  # client certificate.
  cert_file: ""
  key_file: ""
  client_ca_file: ""

auth:
  # Applies only to a listener whose *_tls block above also sets
  # client_ca_file. Identity comes from the client cert's SPIFFE ID (a
  # single URI SAN, spiffe://<trust-domain>/<path>); certs with zero or
  # more than one URI SAN, or a non-spiffe:// URI SAN, are rejected.
  role_mapping:
    []
    # - match: exact           # exact | prefix
    #   spiffe_id: spiffe://grex-api.internal/user/alice
    #   role: viewer            # viewer | admin
  # Role for an authenticated caller matching no rule. "none" denies access.
  default_role: none

metrics:
  # Per-agent metric series (grex_agent_health,
  # grex_agent_last_seen_timestamp_seconds) are omitted entirely when the
  # fleet exceeds this limit; aggregate series always remain.
  per_agent_series_limit: 1000

ui:
  # How often the embedded web UI refreshes fleet data (htmx poll interval).
  poll_interval: 5s

fleet:
  # How often each agent is expected to check in.
  heartbeat_interval: 30s
  # How many consecutive check-ins an agent may miss before it is
  # evicted from fleet state and the UI.
  stale_missed_heartbeats: 3
  # AgentDescription attribute keys every agent must report. Missing keys
  # are logged and counted in metrics; empty disables enforcement.
  required_attributes: []

debug:
  # Mounts net/http/pprof under /debug/pprof on the telemetry listener.
  # Off by default: exposes memory contents and profiling itself adds load.
  # Only enable when the telemetry listener is not reachable from untrusted
  # networks.
  pprof_enabled: false

log:
  # debug, info, warn, error
  level: info
  # text, json
  format: text

database:
  # Connection settings for the future durable state and job dispatch
  # backend (see docs/spec/design.md's Post-1.0 roadmap). Unused by any
  # runtime path today: internal/fleet.Registry holds all fleet state
  # in-memory, and internal/persistence's interfaces have no implementation.
  host: ""
  port: 5432
  user: ""
  password: ""
  dbname: ""
  # disable, require, verify-ca, verify-full
  sslmode: disable
