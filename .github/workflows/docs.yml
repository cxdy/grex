name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/docs.yml"
      - "logo.png"
      - "deploy/charts/**"
      - "justfile"
      - "scripts/**"
      - "internal/ui/static/**"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/docs.yml"
      - "logo.png"
      - "deploy/charts/**"
      - "justfile"
      - "scripts/**"
      - "internal/ui/static/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install dependencies
        run: pip install -r requirements-docs.txt
      - name: Install just
        uses: extractions/setup-just@v3
      - name: Sync logo into docs assets
        run: mkdir -p docs/assets && cp logo.png docs/assets/logo.png
      - name: Sync grex UI assets into static demo
        run: just demo-static
      - name: Build site
        run: mkdocs build --strict
      # Helm chart repository lives at /charts/ on the same GitHub Pages site
      # as the docs and demo. That keeps a single Pages deployment (one
      # concurrency group) and avoids a second repo or branch for charts.
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2
      - name: Package Helm chart into site/charts
        run: |
          set -euo pipefail
          mkdir -p site/charts
          helm package deploy/charts/grex --destination site/charts
          helm repo index site/charts \
            --url https://dennisme.github.io/grex/charts
          # Keep a copy of the chart source README for humans browsing the path.
          cp deploy/charts/grex/README.md site/charts/README.md
      - name: Upload artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
