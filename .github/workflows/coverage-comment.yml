name: Coverage comment

# Posts the cobertura PR comment using the base repository's GITHUB_TOKEN.
# That works for PRs from forks, where the pull_request workflow itself only
# has a read-only token and cannot create comments.
#
# Security: this workflow must NOT checkout or execute code from the PR.
# It only downloads the coverage.xml artifact produced by "Go Test" and
# comments on the PR.
on:
  workflow_run:
    workflows: [Go Test]
    types: [completed]

permissions:
  actions: read # download artifacts from the Go Test run
  contents: read
  pull-requests: write
  issues: write # PR comments use the issues comments API
  checks: write

jobs:
  comment:
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .

      - name: Resolve pull request number
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          # Populated for pull_request-triggered runs (including forks).
          PR_FROM_EVENT: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          set -euo pipefail
          pr="${PR_FROM_EVENT:-}"
          if [ -z "$pr" ]; then
            # Fallback when pull_requests is empty (race / edge cases).
            pr="$(gh api \
              -H "Accept: application/vnd.github+json" \
              "repos/${REPO}/commits/${HEAD_SHA}/pulls" \
              --jq '.[0].number // empty')"
          fi
          if [ -z "$pr" ]; then
            echo "No pull request found for sha=${HEAD_SHA}; skipping comment."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "number=${pr}" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Commenting on PR #${pr}"

      - name: Coverage report
        if: steps.pr.outputs.skip != 'true'
        uses: 5monkeys/cobertura-action@v14
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          report_name: coverage
          path: coverage.xml
          pull_request_number: ${{ steps.pr.outputs.number }}
          minimum_coverage: 70
          fail_below_threshold: false
          skip_covered: true
          show_line: true
          show_branch: false
          show_class_names: false
          show_missing: true
          link_missing_lines: true
          only_changed_files: false
