name: helm

on:
  push:
    branches: [main]
    paths:
      - "deploy/charts/**"
      - "Dockerfile"
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/helm.yml"
  pull_request:
    paths:
      - "deploy/charts/**"
      - "Dockerfile"
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/helm.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2
      - name: Lint chart
        run: helm lint deploy/charts/grex
      - name: Template (defaults)
        run: helm template grex deploy/charts/grex >/dev/null
      - name: Template (TLS, Ingress, ServiceMonitor, gateway)
        run: |
          helm template grex deploy/charts/grex \
            --set tls.enabled=true \
            --set tls.existingSecret=grex-tls \
            --set ingress.enabled=true \
            --set serviceMonitor.enabled=true \
            --set opampGateway.enabled=true \
            --set metrics.serviceAnnotations.enabled=true \
            >/dev/null
      - name: Package chart
        run: helm package deploy/charts/grex --destination /tmp

  # Same entrypoint as local `make helm-e2e-kind` / deploy/charts/smoke.sh.
  e2e-kind:
    runs-on: ubuntu-latest
    needs: helm-lint
    steps:
      - uses: actions/checkout@v4
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2
      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: grex-e2e
          wait: 120s
      - name: Chart smoke (build, load, install, assert)
        run: |
          chmod +x deploy/charts/smoke.sh
          # kind-action already created the cluster; reuse it.
          ./deploy/charts/smoke.sh --provider kind --no-create
      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl -n grex-e2e get all,cm,sa -o wide || true
          kubectl -n grex-e2e describe deploy,pods || true
          kubectl -n grex-e2e logs -l app.kubernetes.io/instance=grex --tail=200 || true
          cat /tmp/grex-helm-smoke-pf.log 2>/dev/null || true
