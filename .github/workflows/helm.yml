name: helm

on:
  push:
    branches: [main]
    paths:
      - "deploy/charts/**"
      - ".github/workflows/helm.yml"
  pull_request:
    paths:
      - "deploy/charts/**"
      - ".github/workflows/helm.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2
      - name: Lint chart
        run: helm lint deploy/charts/grex
      - name: Template (defaults)
        run: helm template grex deploy/charts/grex >/dev/null
      - name: Template (TLS, Ingress, ServiceMonitor, gateway)
        run: |
          helm template grex deploy/charts/grex \
            --set tls.enabled=true \
            --set tls.existingSecret=grex-tls \
            --set ingress.enabled=true \
            --set serviceMonitor.enabled=true \
            --set opampGateway.enabled=true \
            --set metrics.serviceAnnotations.enabled=true \
            >/dev/null
      - name: Package chart
        run: helm package deploy/charts/grex --destination /tmp
