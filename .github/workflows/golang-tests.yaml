name: Go Test

on:
  push:
    tags:
      - v*
    branches: [main]
  pull_request:

# Fork PRs get a read-only GITHUB_TOKEN. Do not try to post PR comments here.
# Coverage comments are posted by coverage-comment.yml via workflow_run (base-repo
# token + artifact from this job).
permissions:
  contents: read
  packages: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install dependencies
        run: go mod download

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck -show verbose ./...

      - name: Build
        run: make build

      - name: Run tests
        run: make test

      - name: Coverage
        run: make coverage

      # Artifact is consumed by coverage-comment.yml (workflow_run) so fork PRs
      # can still get a report comment with a write-capable base-repo token.
      - name: Upload coverage XML
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 5
          if-no-files-found: error
